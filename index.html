<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexus ERP · 一天的智能</title>
<style>
:root{
  --bg:#eceff3;
  --panel:#ffffff;
  --ink:#0d1117;
  --ink2:#39414f;
  --muted:#7b8494;
  --faint:#9aa3b0;
  --line:#e2e6ec;
  --line-soft:#eef0f5;
  --accent:#2f4fd8;
  --red:#c4392f;
  --red-soft:#fdf0ee;
  --amber:#a8720f;
  --amber-soft:#fdf5e3;
  --green:#187a52;
  --green-soft:#ebf7f0;
  --radius:16px;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px -12px rgba(16,24,40,.14);
  --tone:#2f4fd8;
  --tone-soft:#eef1ff;
  --tone-line:#dbe1f8;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:"Inter","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  color:var(--ink);background:var(--bg);
  -webkit-font-smoothing:antialiased;font-size:14px;
}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
::selection{background:#d6ddfb}
.app{height:100%;display:flex;flex-direction:column;overflow:hidden}

/* ============ top ============ */
.top{
  height:58px;flex:none;display:flex;align-items:center;gap:18px;
  padding:0 18px;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);z-index:30;position:relative;
}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.mark{
  width:26px;height:26px;border-radius:8px;flex:none;
  background:linear-gradient(145deg,#1b2559,#2f4fd8 55%,#6b8cff);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35);display:grid;place-items:center;
}
.mark:after{content:"";width:9px;height:9px;border-radius:3px;background:#fff;opacity:.92;transform:rotate(45deg)}
.brand b{font-size:14px;letter-spacing:.2px;font-weight:650}
.brand span{color:var(--faint);font-size:12px;letter-spacing:.3px}

.ws{display:flex;align-items:center;gap:7px;flex:1;min-width:0;overflow:hidden;mask-image:linear-gradient(90deg,#000 88%,transparent)}
.ws-label{font-size:11px;color:var(--faint);letter-spacing:.6px;flex:none}
.chip{
  display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;flex:none;
  border:1px solid var(--line);background:#fff;border-radius:999px;font-size:12px;color:var(--ink2);
  white-space:nowrap;transition:.18s;animation:chipIn .4s cubic-bezier(.2,.7,.3,1) both;
}
.chip .dot{width:5px;height:5px;border-radius:2px;background:var(--tone);opacity:.8}
.chip.new{background:var(--tone-soft);border-color:var(--tone-line);color:var(--tone)}
@keyframes chipIn{from{opacity:0;transform:translateY(-6px) scale(.94)}to{opacity:1;transform:none}}
.ws-empty{font-size:12px;color:#b7bfcb;white-space:nowrap}

.role{display:flex;align-items:center;gap:9px;flex:none;padding-left:16px;border-left:1px solid var(--line)}
.role .av{
  width:30px;height:30px;border-radius:10px;display:grid;place-items:center;
  font-size:12px;font-weight:600;color:#fff;background:#4a5a7a;
  transition:background .4s;
}
.role .tx{line-height:1.3;transition:opacity .2s;max-width:172px;overflow:hidden}
.role .tx b{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.role .tx span{display:block;font-size:10.5px;color:var(--faint);letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.role.swap .tx{animation:swapTx .45s ease both}
.role.swap .av{animation:swapAv .45s ease both}
@keyframes swapTx{0%{opacity:0;transform:translateX(6px)}100%{opacity:1;transform:none}}
@keyframes swapAv{0%{transform:scale(.85);opacity:.5}100%{transform:none;opacity:1}}

/* ============ layout ============ */
main{flex:1;min-height:0;display:flex}

/* ============ chat ============ */
.chat{width:394px;flex:none;display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--line)}
.feed{flex:1;min-height:0;overflow-y:auto;padding:20px 20px 10px;scroll-behavior:smooth}
.feed::-webkit-scrollbar{width:8px}
.feed::-webkit-scrollbar-thumb{background:#e0e4ec;border-radius:8px;border:2px solid #fff}

.divider{display:flex;align-items:center;gap:10px;margin:6px 0 18px;animation:fade .5s both}
.divider .line{flex:1;height:1px;background:var(--line)}
.divider .tx{font-size:10.5px;color:var(--faint);letter-spacing:.5px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.divider .tx i{width:4px;height:4px;border-radius:50%;background:#cbd2de}
@keyframes fade{from{opacity:0}to{opacity:1}}

.msg{margin-bottom:16px;animation:msgIn .4s cubic-bezier(.2,.7,.3,1) both}
@keyframes msgIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.msg .head{display:flex;align-items:center;gap:7px;margin-bottom:5px;font-size:11px;color:var(--faint);letter-spacing:.3px}
.msg .head .ai-dot{width:14px;height:14px;border-radius:4.5px;background:linear-gradient(145deg,#1b2559,#2f4fd8);display:grid;place-items:center;flex:none}
.msg .head .ai-dot:after{content:"";width:5px;height:5px;background:#fff;border-radius:1.5px;transform:rotate(45deg)}
.msg .body{font-size:13.6px;line-height:1.75;color:var(--ink2);white-space:pre-wrap;word-break:break-word}
.msg .body b{font-weight:600;color:var(--ink)}
.msg .body code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.3px;background:#f3f5f8;padding:1px 4.5px;border-radius:4px;color:#3a4a63}
.msg.me{display:flex;flex-direction:column;align-items:flex-end}
.msg.me .body{background:#f1f3f8;border:1px solid #e8ebf2;border-radius:14px 14px 4px 14px;padding:8px 13px;max-width:88%;color:var(--ink)}

.typing{display:inline-flex;gap:4px;padding:6px 0}
.typing i{width:5px;height:5px;border-radius:50%;background:#b9c0cd;animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.18s}
.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}

/* trace */
.trace{margin-top:9px;border-left:2px solid #e7eaf1;padding-left:10px;overflow:hidden;transition:.3s}
.trace .tr{font-size:11.5px;color:#96a0af;line-height:1.75;display:flex;align-items:center;gap:6px;animation:trIn .35s both}
.trace .tr:before{content:"";width:3.5px;height:3.5px;border-radius:50%;background:#cbd3e0;flex:none}
.trace .tr.done:before{background:#9db3e0}
@keyframes trIn{from{opacity:0;transform:translateX(-4px)}to{opacity:1;transform:none}}
.trace.collapsed{max-height:22px}
.trace .sum{display:none;font-size:11px;color:#a6b0c0;cursor:pointer;align-items:center;gap:5px}
.trace.collapsed .sum{display:flex}
.trace.collapsed .tr{display:none}

/* chat footer */
.chatfoot{
  flex:none;height:44px;display:flex;align-items:center;gap:10px;padding:0 20px 12px;
  font-size:11.5px;color:var(--faint);
}
.live{display:inline-flex;align-items:center;gap:6px;color:#8a93a3}
.live i{width:6px;height:6px;border-radius:50%;background:#31b06e;box-shadow:0 0 0 3px rgba(49,176,110,.14);animation:livePulse 1.8s infinite}
@keyframes livePulse{0%,100%{box-shadow:0 0 0 3px rgba(49,176,110,.14)}50%{box-shadow:0 0 0 6px rgba(49,176,110,0)}}
.chatfoot .sp{flex:1}
.chatfoot .kbd{font-size:10.5px;color:#b6bec9}

/* ============ canvas ============ */
.canvas{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;overflow:hidden;transition:background .6s}
.canvas[data-tone="ops"]{--tone:#2f4fd8;--tone-soft:#eef1ff;--tone-line:#dbe1f8}
.canvas[data-tone="buy"]{--tone:#a8620f;--tone-soft:#fdf4e7;--tone-line:#f0dfc2}
.canvas[data-tone="fin"]{--tone:#13795b;--tone-soft:#e9f6f0;--tone-line:#cdeadd}
.canvas[data-tone="qms"]{--tone:#6d3fc4;--tone-soft:#f3edfd;--tone-line:#e2d7f9}
.canvas[data-tone="gov"]{--tone:#b03434;--tone-soft:#fdf0ee;--tone-line:#f3d8d4}
.canvas[data-tone="dec"]{--tone:#1f3fa8;--tone-soft:#edf1ff;--tone-line:#d8e0fa}
.canvas:before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(circle at 1px 1px,#d5dae4 1px,transparent 0);
  background-size:24px 24px;
  mask-image:radial-gradient(120% 90% at 30% 0%,#000 18%,transparent 76%);
  opacity:.72;
}
.canvas:after{
  content:"";position:absolute;left:-10%;top:-30%;width:70%;height:90%;pointer-events:none;
  background:radial-gradient(circle at 50% 50%,var(--tone-soft) 0%,transparent 62%);
  opacity:.85;transition:.8s;
}
.canvas-head{flex:none;display:flex;align-items:center;gap:14px;padding:14px 26px 8px;position:relative;z-index:2}
.intent{display:flex;align-items:center;gap:9px;flex:1;min-width:0;font-size:12px;color:var(--muted);overflow:hidden}
.intent .tag{
  display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 8px;border-radius:6px;
  background:var(--tone-soft);border:1px solid var(--tone-line);color:var(--tone);font-size:11px;flex:none;
  transition:.4s;
}
.intent .tag:before{content:"";width:5px;height:5px;border-radius:50%;background:var(--tone);opacity:.75}
.intent .k{color:#a9b2bf;font-size:11px;letter-spacing:.4px}
.intent .v{color:var(--ink2);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.intent .sep{width:1px;height:11px;background:var(--line);flex:none}

.tools{display:flex;gap:8px;flex:none}
.tools button{
  height:29px;padding:0 11px;border-radius:9px;border:1px solid var(--line);
  background:rgba(255,255,255,.85);font-size:12.5px;color:var(--ink2);transition:.16s;
  display:inline-flex;align-items:center;gap:6px;
}
.tools button:hover{border-color:#c3cbe0;background:#fff;color:var(--ink);box-shadow:0 2px 10px -6px rgba(16,24,40,.4)}
.tools button.primary{background:#111827;border-color:#111827;color:#fff}
.tools button.primary:hover{background:#000;color:#fff}
.tools svg{width:13px;height:13px;opacity:.85}

.stage{flex:1;min-height:0;overflow-y:auto;padding:4px 26px 88px;position:relative;z-index:2}
.stage::-webkit-scrollbar{width:10px}
.stage::-webkit-scrollbar-thumb{background:#dbe0e9;border-radius:10px;border:3px solid transparent;background-clip:content-box}

/* player */
.player{
  position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:12;
  display:flex;align-items:center;gap:10px;height:42px;padding:0 12px;
  background:rgba(255,255,255,.82);backdrop-filter:blur(14px);
  border:1px solid rgba(210,216,228,.9);border-radius:999px;
  box-shadow:0 8px 30px -12px rgba(16,24,40,.35),0 1px 2px rgba(16,24,40,.05);
}
.player button.ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--ink2);transition:.16s}
.player button.ic:hover{background:#eff2f8;color:var(--ink)}
.player .sp{width:1px;height:16px;background:#e2e6ee}
.rail{display:flex;align-items:center;gap:6px}
.rail .n{
  width:22px;height:22px;border-radius:7px;display:grid;place-items:center;
  font-size:10px;color:#b3bac6;font-variant-numeric:tabular-nums;transition:.2s;cursor:pointer;
}
.rail .n:hover{background:#eff2f8;color:var(--ink2)}
.rail .n.done{color:#8f99a8;background:#f2f4f8}
.rail .n.now{background:#111827;color:#fff;box-shadow:0 2px 8px -2px rgba(0,0,0,.5)}
.rail .n.now:after{content:"";position:absolute}
.player .spd{font-size:11px;color:#7b8494;padding:0 6px;height:26px;border-radius:7px;transition:.16s;font-variant-numeric:tabular-nums}
.player .spd:hover{background:#eff2f8;color:var(--ink)}

/* ============ surface ============ */
.surface{animation:rise .5s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.994)}to{opacity:1;transform:none}}

.s-head{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin:8px 0 18px}
.eyebrow{
  display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.6px;
  color:var(--tone);background:var(--tone-soft);border:1px solid var(--tone-line);
  border-radius:6px;padding:3px 8px;margin-bottom:10px;transition:.4s;
}
.eyebrow:before{content:"";width:5px;height:5px;border-radius:50%;background:var(--tone);opacity:.75}
.s-head h2{margin:0;font-size:21px;font-weight:650;letter-spacing:-.3px;color:var(--ink)}
.s-head .sub{margin:6px 0 0;font-size:12.5px;color:var(--muted);line-height:1.6}
.s-meta{display:flex;gap:22px;flex:none;padding-top:4px}
.s-meta div{text-align:right}
.s-meta b{display:block;font-size:18px;font-weight:650;letter-spacing:-.3px;color:var(--ink);font-variant-numeric:tabular-nums}
.s-meta span{font-size:10.5px;color:var(--faint)}
.s-foot{
  margin-top:16px;padding-top:11px;border-top:1px solid var(--line-soft);
  display:flex;justify-content:space-between;gap:12px;font-size:11px;color:var(--faint);
}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}

/* brief */
.todo{display:flex;flex-direction:column;gap:9px}
.t-row{
  display:flex;align-items:flex-start;gap:13px;padding:14px 16px;border-radius:13px;
  background:#fff;border:1px solid var(--line);box-shadow:0 1px 2px rgba(16,24,40,.03);transition:.18s;
  animation:rise .45s both;
}
.t-row:hover{border-color:#cfd6e6;box-shadow:0 8px 22px -16px rgba(16,24,40,.6)}
.t-row.soft{border-style:dashed;background:#fcfcfd}
.t-ic{width:32px;height:32px;border-radius:10px;flex:none;display:grid;place-items:center;font-size:13px}
.t-ic.red{background:var(--red-soft);color:var(--red)}
.t-ic.amber{background:var(--amber-soft);color:var(--amber)}
.t-ic.gray{background:#f2f4f8;color:#8b95a5}
.t-main{flex:1;min-width:0}
.t-main .n{font-size:13.4px;font-weight:600;color:var(--ink);margin-bottom:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.t-main .d{font-size:12.4px;color:var(--muted);line-height:1.6}
.t-main .why{font-size:11.5px;color:#98a2b0;margin-top:7px;display:flex;align-items:center;gap:6px}
.t-main .why:before{content:"↳";color:#c3cbd8}
.t-go{font-size:11.5px;color:var(--tone);flex:none;opacity:0;transform:translateX(-4px);transition:.18s;padding-top:3px}
.t-row:hover .t-go{opacity:1;transform:none}
.pill{font-size:10.5px;padding:1.5px 7px;border-radius:5px;font-weight:500;letter-spacing:.2px;flex:none}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.green{background:var(--green-soft);color:var(--green)}
.pill.gray{background:#f2f4f8;color:#6c7686}
.pill.violet{background:#f2ecfd;color:#6d3fc4}

/* table */
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:12.8px}
.tbl th{text-align:left;font-weight:500;font-size:10.5px;color:var(--faint);letter-spacing:.5px;padding:0 14px 10px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
.tbl tr.best td{background:linear-gradient(90deg,var(--tone-soft),transparent 70%)}
.tbl tr.best td:first-child{box-shadow:inset 2px 0 0 var(--tone)}
.tbl td{padding:13px 14px;border-bottom:1px solid var(--line-soft);color:var(--ink2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.tbl .nm{font-weight:600;color:var(--ink)}
.tbl .mo{font-size:11px;color:var(--faint);margin-top:2px}
.tbl .lock{color:#b7bfcb;letter-spacing:2px}
.bar-mini{display:inline-flex;align-items:center;gap:7px}
.bar-mini i{display:block;height:4px;border-radius:4px;background:var(--tone);opacity:.55}
.score{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink)}

/* chart */
.chart{position:relative;height:186px;margin:6px 2px 0;padding-bottom:2px}
.chart .zero{position:absolute;left:0;right:0;border-top:1px dashed #dfe3ec;z-index:1}
.chart .bars{display:flex;align-items:flex-end;gap:6px;height:100%;position:relative;z-index:2}
.chart .col{flex:1;height:100%;position:relative}
.chart .col .fill{position:absolute;left:0;right:0;border-radius:5px 5px 0 0;background:linear-gradient(180deg,#9fb0d8,#c9d3e8);transition:height .6s cubic-bezier(.2,.7,.3,1);min-height:2px}
.chart .col.neg .fill{background:linear-gradient(180deg,#e0857c,#c4392f);border-radius:0 0 5px 5px}
.chart .col.hi .fill{background:linear-gradient(180deg,#c4392f,#8d251c);box-shadow:0 0 0 3px rgba(196,57,47,.12)}
.chart .col .lb{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:9px;color:#b3bac6;letter-spacing:-.2px}
.chart-x{height:20px}
.levers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.lever{padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;transition:.18s}
.lever:hover{border-color:#cfd6e6;box-shadow:0 8px 22px -18px rgba(16,24,40,.6)}
.lever .l{font-size:11px;color:var(--faint);margin-bottom:5px}
.lever .v{font-size:16px;font-weight:650;letter-spacing:-.2px;color:var(--ink);font-variant-numeric:tabular-nums}
.lever .d{font-size:11px;color:#96a0af;margin-top:5px;line-height:1.5}

/* flow */
.flow{display:flex;align-items:stretch;padding:16px 2px 4px;overflow-x:auto}
.node{flex:1;min-width:124px;position:relative;padding:0 8px}
.node .line{position:absolute;top:15px;left:-9px;right:-9px;height:1px;background:var(--line);z-index:0}
.node:first-child .line{display:none}
.dot{
  width:31px;height:31px;border-radius:10px;background:#fff;border:1px solid var(--line);
  display:grid;place-items:center;position:relative;z-index:2;margin-bottom:9px;
  font-size:11.5px;font-weight:600;color:#98a1b0;transition:.3s;
}
.node.done .dot{background:var(--green-soft);border-color:#c6e6d6;color:var(--green)}
.node.now .dot{background:#fff;border-color:#e5c68a;color:var(--amber);box-shadow:0 0 0 5px rgba(217,154,43,.1);animation:pulse 2.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 5px rgba(217,154,43,.1)}50%{box-shadow:0 0 0 9px rgba(217,154,43,.02)}}
.node .nm{font-size:12.2px;font-weight:600;color:var(--ink2);line-height:1.4}
.node.todo .nm{color:#a2aab8;font-weight:500}
.node .pn{font-size:10.5px;color:var(--faint);margin-top:2px}
.node .st{font-size:10px;margin-top:6px;display:inline-block;padding:1.5px 6px;border-radius:5px}
.st.done{background:var(--green-soft);color:var(--green)}
.st.now{background:var(--amber-soft);color:var(--amber)}
.st.todo{background:#f3f5f8;color:#9aa3b0}
.st.auto{background:#eef2ff;color:#3a55c8}

/* chain */
.chain{display:flex;flex-direction:column;gap:0}
.link{display:flex;gap:14px;position:relative;padding-bottom:10px}
.link:last-child{padding-bottom:0}
.link .rail-v{width:26px;flex:none;display:flex;flex-direction:column;align-items:center;position:relative}
.link .rail-v:before{content:"";position:absolute;top:26px;bottom:-10px;width:1px;background:var(--line)}
.link:last-child .rail-v:before{display:none}
.link .num{
  width:26px;height:26px;border-radius:9px;background:#fff;border:1px solid var(--line);
  display:grid;place-items:center;font-size:11px;color:#8b95a5;font-weight:600;z-index:1;
}
.link.hi .num{border-color:var(--tone-line);background:var(--tone-soft);color:var(--tone)}
.link .bx{flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:2px;transition:.2s}
.link .bx:hover{border-color:#cfd6e6;box-shadow:0 8px 22px -18px rgba(16,24,40,.5)}
.link .bx .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.link .bx .t{font-size:12.6px;font-weight:600;color:var(--ink)}
.link .bx .x{font-size:12px;color:var(--muted);line-height:1.6}
.link .bx .x b{color:var(--ink);font-weight:600}
.conf{display:flex;align-items:center;gap:7px;flex:none}
.conf .bar{width:52px;height:4px;border-radius:4px;background:#eef0f5;overflow:hidden}
.conf .bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#cdd6e8,#9fb0d8)}
.conf.low .bar i{background:linear-gradient(90deg,#f2d39a,#d98f2b)}
.conf.low span{color:#b8791f;font-weight:600}
.conf span{font-size:10.5px;color:#98a2b0;font-variant-numeric:tabular-nums}

/* guard */
.g2{display:grid;grid-template-columns:1.45fr 1fr;gap:14px;align-items:start}
.alert{padding:16px 18px}
.alert .h{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.alert .h .ic{width:26px;height:26px;border-radius:8px;background:var(--red-soft);color:var(--red);display:grid;place-items:center;font-size:13px}
.alert .h b{font-size:13.5px}
.alert .kv{display:grid;grid-template-columns:1fr 1fr;gap:11px 20px;margin:12px 0}
.alert .kv .i .l{font-size:10.5px;color:var(--faint);margin-bottom:3px}
.alert .kv .i .v{font-size:12.8px;color:var(--ink);font-weight:500}
.alert .kv .i .v.red{color:var(--red)}
.alert .note{font-size:11.5px;color:#96a0af;background:#fafbfd;border:1px solid var(--line-soft);border-radius:9px;padding:9px 11px;line-height:1.6}
.perm{padding:16px 18px}
.perm h4{margin:0 0 12px;font-size:12px;color:var(--ink2);font-weight:600}
.perm .row{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink2);padding:6px 0;border-bottom:1px solid var(--line-soft)}
.perm .row:last-child{border-bottom:0}
.perm .row .r{flex:1}
.perm .tag{font-size:10px;padding:1px 6px;border-radius:4px}
.ok-tag{background:var(--green-soft);color:var(--green)}
.no-tag{background:#f4f5f8;color:#a6afbd}

/* diff */
.delta{font-size:11px;padding:1.5px 6px;border-radius:5px;font-variant-numeric:tabular-nums}
.delta.up{background:var(--green-soft);color:var(--green)}
.delta.dn{background:var(--red-soft);color:var(--red)}
.delta.flat{background:#f2f4f8;color:#8a93a3}
.note-row{display:flex;gap:11px;align-items:flex-start;padding:13px 15px;border-radius:12px;background:var(--tone-soft);border:1px solid var(--tone-line)}
.note-row .ic{color:var(--tone);flex:none;margin-top:1px;font-size:13px}
.note-row .tx{font-size:12.3px;color:var(--ink2);line-height:1.7}
.note-row .tx b{color:var(--ink);font-weight:600}

.act-row{display:flex;gap:9px;margin-top:12px;flex-wrap:wrap}
.act-btn{
  height:36px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:#fff;
  font-size:12.6px;font-weight:550;color:var(--ink2);transition:.16s;
  display:inline-flex;align-items:center;gap:7px;
}
.act-btn:hover{border-color:#c3cbe0;background:#fafbff;color:var(--tone)}
.act-btn.dark{background:#111827;border-color:#111827;color:#fff}
.act-btn.dark:hover{background:#000;color:#fff;box-shadow:0 6px 18px -10px rgba(0,0,0,.8)}
.act-btn.sign{background:var(--tone);border-color:var(--tone);color:#fff;position:relative}
.act-btn.sign:hover{filter:brightness(1.06);color:#fff}
.act-btn.sign.attention:after{
  content:"";position:absolute;inset:-4px;border-radius:13px;border:1px solid var(--tone);
  opacity:.45;animation:ring 1.8s infinite;
}
@keyframes ring{0%{transform:scale(.98);opacity:.5}100%{transform:scale(1.06);opacity:0}}

.auto-done{margin-top:14px;border:1px dashed #d8dee9;border-radius:13px;padding:13px 16px;background:rgba(255,255,255,.62)}
.auto-done .ad-h{font-size:11px;color:#98a2b0;letter-spacing:.4px;margin-bottom:9px;display:flex;align-items:center;gap:7px}
.auto-done .ad-h:before{content:"";width:5px;height:5px;border-radius:50%;background:#31b06e}
.ad-list{display:flex;flex-wrap:wrap;gap:7px}
.ad-list span{font-size:12px;color:#5b6675;background:#fff;border:1px solid var(--line-soft);border-radius:7px;padding:5px 10px;display:inline-flex;align-items:center;gap:6px}
.ad-list span:before{content:"✓";color:#31b06e;font-size:10px}

/* cockpit */.cock{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.cock .c{
  padding:15px 16px;border-radius:14px;background:#fff;border:1px solid var(--line);
  box-shadow:var(--shadow);transition:.2s;position:relative;overflow:hidden;
}
.cock .c:hover{transform:translateY(-2px);border-color:#cfd6e6;box-shadow:0 16px 34px -22px rgba(16,24,40,.7)}
.cock .c .ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:13px;margin-bottom:11px}
.cock .c .t{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:5px}
.cock .c .d{font-size:11.5px;color:var(--muted);line-height:1.6}
.cock .c .st{position:absolute;top:14px;right:14px;font-size:10px;padding:2px 7px;border-radius:5px;background:var(--green-soft);color:var(--green)}
.cock .c.auto .st{background:#eef2ff;color:#3a55c8}
.cock-foot{
  margin-top:14px;padding:16px 18px;border-radius:14px;
  background:linear-gradient(120deg,#12172a,#1f2a4d 60%,#26356b);color:#dfe6f6;
  display:flex;align-items:center;gap:16px;
}
.cock-foot .big{font-size:15px;font-weight:600;letter-spacing:.2px;line-height:1.5}
.cock-foot .sub{font-size:12px;color:#93a1c2;margin-top:4px;line-height:1.6}
.cock-foot .sp{flex:1}
.cock-foot .badge{font-size:11px;padding:5px 10px;border-radius:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);white-space:nowrap}

/* drawer */
.drawer{
  position:fixed;top:0;right:0;height:100%;width:450px;background:#0e1117;color:#c8d3e4;
  transform:translateX(101%);transition:transform .34s cubic-bezier(.3,.8,.3,1);z-index:70;
  display:flex;flex-direction:column;box-shadow:-20px 0 60px -30px rgba(0,0,0,.6);
}
.drawer.open{transform:none}
.drawer .dh{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid #1c2230}
.drawer .dh b{font-size:13px;color:#e6edf8;font-weight:600;letter-spacing:.2px}
.drawer .dh span{font-size:11px;color:#5f6b7f;display:block;margin-top:2px}
.drawer .x{width:26px;height:26px;border-radius:7px;border:1px solid #232b3a;color:#8b96a8;display:grid;place-items:center;font-size:12px}
.drawer .x:hover{background:#1a2130;color:#fff}
.drawer pre{flex:1;overflow:auto;margin:0;padding:16px 18px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.4px;line-height:1.75;color:#9fb0c9;white-space:pre-wrap}
.drawer pre .s{color:#7ee0a8}
.drawer pre .k{color:#8fb8ff}
.drawer pre .n{color:#f0b46b}
.drawer .df{padding:12px 18px 18px;border-top:1px solid #1c2230;font-size:11px;color:#5f6b7f;line-height:1.6}

/* toast */
.toast-wrap{position:fixed;bottom:118px;left:calc(394px + (100vw - 394px)/2);transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{
  background:#0f1420;color:#e8eef8;font-size:12.5px;padding:9px 15px;border-radius:10px;
  box-shadow:0 12px 34px -14px rgba(0,0,0,.6);display:flex;align-items:center;gap:9px;
  animation:tIn .32s cubic-bezier(.2,.7,.3,1) both;
}
.toast .tick{width:14px;height:14px;border-radius:50%;background:#2f9e6b;display:grid;place-items:center;flex:none;font-size:9px}
@keyframes tIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

@media (max-width:1180px){
  .chat{width:348px}
  .g2{grid-template-columns:1fr}
  .levers{grid-template-columns:1fr}
  .cock{grid-template-columns:1fr}
}
@media (max-width:900px){
  main{flex-direction:column}
  .chat{width:100%;height:46%}
  .canvas{border-top:1px solid var(--line)}
  .ws{display:none}
}

<body>
<div class="app">

</div>

<div class="drawer" id="drawer">
  <div class="dh">

  </div>

</div>

<div class="toast-wrap" id="toasts"></div>

<script>
/* ==========================================================
   0. 工具
   ========================================================== */
const $ = (s, r = document) => r.querySelector(s);
const el = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstElementChild; };
const feed = $('#feed'), stage = $('#stage'), canvas = $('#canvas'), rail = $('#rail');
const sleepREAL = (ms) => new Promise(r => setTimeout(r, ms));

const CTRL = { paused:false, speed:1, token:0 };
let lastRun = 0;

/* 可暂停 / 可变速 / 可中断的等待 */
function wait(ms){
  return new Promise(resolve => {
    const my = CTRL.token;
    let left = ms, last = performance.now();
    const tick = () => {
      if (my !== CTRL.token) return resolve();
      const now = performance.now();
      if (!CTRL.paused) left -= (now - last) * CTRL.speed;
      last = now;
      if (left <= 0) return resolve();
      setTimeout(tick, 40);
    };
    tick();
  });
}

const ai = (t) => t
  .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
  .replace(/`([^`]+)`/g, '<code>$1</code>')
  .replace(/\*\*/g, '');

function scrollFeed(){ feed.scrollTop = feed.scrollHeight; }

/* ==========================================================
   1. 对话渲染
   ========================================================== */
function addDivider(text){
  feed.appendChild(el(`<div class="divider"><span class="line"></span><span class="tx"><i></i>${text}<i></i></span><span class="line"></span></div>`));
  scrollFeed();
}

function addUser(text){
  const m = el(`<div class="msg me"><div class="body"></div></div>`);
  m.querySelector('.body').textContent = text;
  feed.appendChild(m); scrollFeed();
}

async function addBot(text, my, o = {}){
  const m = el(`<div class="msg bot">
    <div class="head"><span class="ai-dot"></span>助手</div>
    <div class="body"></div>
  </div>`);
  feed.appendChild(m);
  const body = m.querySelector('.body');
  body.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
  scrollFeed();
  await wait(380 + Math.min(text.length * 7, 620));
  if (my !== CTRL.token) { body.innerHTML = ai(text); return m; }

  body.innerHTML = '';
  for (let n = 0; n < text.length; n += 3){
    if (my !== CTRL.token) break;
    body.innerHTML = ai(text.slice(0, n + 3));
    scrollFeed();
    await wait(15);
  }
  body.innerHTML = ai(text);
  scrollFeed();

  if (o.trace) addTrace(m, o.trace);
  return m;
}

function addTrace(msgEl, lines){
  const wrap = el(`<div class="trace"></div>`);
  const sum = el(`<div class="sum">▸ 推理路径 · ${lines.length} 步</div>`);
  sum.onclick = () => wrap.classList.remove('collapsed');
  wrap.appendChild(sum);
  lines.forEach((t, i) => {
    const row = el(`<div class="tr" style="animation-delay:${i * 90}ms"></div>`);
    row.textContent = t;
    wrap.appendChild(row);
  });
  msgEl.appendChild(wrap);
  setTimeout(() => { if (msgEl.isConnected) wrap.classList.add('collapsed'); }, 4200);
}

/* ==========================================================
   2. 画布通用件
   ========================================================== */
function sHead(eyebrow, title, sub, meta = []){
  return `<div class="s-head">
    <div><div class="eyebrow">${eyebrow}</div><h2>${title}</h2><p class="sub">${sub}</p></div>
    <div class="s-meta">${meta.map(x => `<div><b>${x.v}</b><span>${x.k}</span></div>`).join('')}</div>
  </div>`;
}
const sFoot = (l, r) => `<div class="s-foot"><span>${l}</span><span>${r}</span></div>`;

const META = {
  brief:{ intent:'今天该处理什么', view:'待办简报', data:'审批 / 订单 / 定价' },
  sourcing:{ intent:'缺料寻源决策', view:'比价矩阵', data:'供应商 / 协议 / 采购' },
  cash:{ intent:'未来 14 天资金', view:'现金流曲线', data:'应收 / 应付 / 银行' },
  approval:{ intent:'推进阻塞审批', view:'审批流', data:'审批中心 · PR-5512' },
  yield:{ intent:'良率异常归因', view:'证据链', data:'MES / QMS / 设备 / PLM' },
  guard:{ intent:'异常行为处置', view:'安全事件', data:'IAM / 日志 / 主数据' },
  diff:{ intent:'毛利 vs 违约权衡', view:'变更提案', data:'订单 / 成本 / 合同' },
  cockpit:{ intent:'今天的沉淀', view:'工作台', data:'全部域' },
};

function render(kind){
  const html = VIEW[kind]();
  const myTok = CTRL.token;
  const old = stage.firstElementChild;
  if (old){
    old.style.transition = 'opacity .18s, transform .18s';
    old.style.opacity = '0';
    old.style.transform = 'translateY(-8px)';
  }
  setTimeout(() => {
    if (myTok !== CTRL.token) return;
    stage.innerHTML = '';
    const node = el(`<div class="surface">${html}</div>`);
    stage.appendChild(node);
    stage.scrollTop = 0;
    const m = META[kind];
    $('#iIntent').textContent = m.intent;
    $('#iView').textContent = m.view;
    $('#iData').textContent = m.data;
    $('#iTag').textContent = '生成中';
    setTimeout(() => { if (kind === CUR.kind) $('#iTag').textContent = '已生成'; }, 620);
    CUR = { kind, html };
    node.querySelectorAll('.s-meta b, .lever .v, .alert .kv .v, .big-num').forEach(countUp);
  }, old ? 190 : 0);
}

let CUR = { kind:null, html:'' };

const REDUCED = typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;

function countUp(node){
  if (REDUCED) return;
  const raw = node.textContent.trim();
  if (/\d:\d/.test(raw)) return;                                   // 时刻不做滚动
  if ((raw.match(/\./g) || []).length > 1) return;                 // IP / 版本号
  const m = raw.match(/^(.*?)(-?[\d,]+(?:\.\d+)?)(\D*)$/);
  if (!m) return;
  const pre = m[1], suf = m[3];
  const target = parseFloat(m[2].replace(/,/g, ''));
  if (!isFinite(target) || target === 0) return;
  const dec = (m[2].split('.')[1] || '').length;
  const t0 = performance.now(), dur = 720;
  const step = (t) => {
    const k = Math.max(0, Math.min(1, (t - t0) / dur));
    const e = 1 - Math.pow(1 - k, 3);
    node.textContent = pre + (target * e).toFixed(dec) + suf;
    if (k < 1) requestAnimationFrame(step); else node.textContent = raw;
  };
  requestAnimationFrame(step);
}

/* ==========================================================
   3. 八个视图
   ========================================================== */
const VIEW = {

  /* 01 晨间简报 */
  brief(){
    const rows = [
      { c:'red', ic:'!', n:'采购审批超时', p:'<span class="pill red">超时 6h</span>',
        d:'PR-5512 · 供应商宏远精密 · ¥486,000 · 压着 SO-2041（¥1.62M）',
        w:'罚则 ¥32,400 / 周，且只有你有越级权限' },
      { c:'amber', ic:'▲', n:'交付风险', p:'<span class="pill amber">剩 2 天</span>',
        d:'SO-2041 华东仓缺料 1,200 pcs MOSFET 驱动 IC',
        w:'客户已把交期从 11-22 提前到 11-20' },
      { c:'gray', ic:'?', n:'价格例外', p:'<span class="pill gray">不做判断</span>',
        d:'华南经销商报价低于底价 4.2%，需要渠道政策口径',
        w:'模型给不出建议 —— 这类事留给你' },
    ];
    return sHead('08:12 · 晨间 · 全量扫描', '今天需要你决定的事',
      '三条里只有一条真的超时。其余两条我按「可以等」处理了。',
      [{v:'3',k:'待处理'},{v:'1',k:'已超时'},{v:'¥1.62M',k:'受影响订单'}])
    + `<div class="todo">${rows.map((r, i) => `
      <div class="t-row ${r.c === 'gray' ? 'soft' : ''}" style="animation-delay:${i * 70}ms">
        <div class="t-ic ${r.c}">${r.ic}</div>
        <div class="t-main">
          <div class="n">${r.n} ${r.p}</div>
          <div class="d">${r.d}</div>
          <div class="why">${r.w}</div>
        </div>
        <span class="t-go">展开 →</span>
      </div>`).join('')}</div>
    <div class="auto-done">
      <div class="ad-h">已经替你处理完 · 不需要你看</div>
      <div class="ad-list">
        <span>47 张报销单自动过账</span>
        <span>12 条批量逾期提醒已发</span>
        <span>下周排产草案已生成</span>
        <span>3 家供应商证照续期</span>
        <span>2 笔对账差异自动匹配</span>
      </div>
    </div>`
    + sFoot('数据来源 · 审批中心 / 订单域 / 定价规则 · 实时', '生成于 08:12');
  },

  /* 02 寻源比价 */
  sourcing(){
    const rows = [
      { n:'宏远精密', mo:'框架协议 · 合作 3 年', p:'¥0.86', t:'48h', a:'60 天', q:'0.8%', s:86, w:78, best:true, tag:'<span class="pill green">推荐</span>' },
      { n:'鸿达电子', mo:'框架协议 · 合作 1 年', p:'¥0.82', t:'96h', a:'30 天', q:'2.3%', s:71, w:62, tag:'<span class="pill amber">交期不足</span>' },
      { n:'瑞芯微代', mo:'协议外 · 需走例外', p:'¥0.91', t:'24h', a:'45 天', q:'0.2%', s:79, w:71, tag:'<span class="pill gray">协议外</span>' },
    ];
    return sHead('08:26 · 采购中心 · 缺料寻源', 'MOSFET 驱动 IC · 1,200 pcs',

/* ==========================================================
   6. 播放器
   ========================================================== */
function mkHelpers(my){
  const alive = () => my === CTRL.token;
  return {
    me: async (t) => { if (!alive()) return; await wait(500); if (!alive()) return; addUser(t); await wait(620); },
    say: async (t, o = {}) => { if (!alive()) return; await wait(o.delay ?? 520); if (!alive()) return; await addBot(t, my, o); },
    show: async (k) => { if (!alive()) return; await wait(420); if (!alive()) return; render(k); },
    hold: async (ms) => { if (!alive()) return; await wait(ms); },
    pin: async () => {
      if (!alive()) return;
      const act = ACTS[CUR_ACT];
      if (!act.pin) return;
      await wait(700); if (!alive()) return;
      pinCurrent(act.pin);
      toast(`已固定「${act.pin}」到工作台`);
    }
  };
}

let CUR_ACT = 0;

function buildRail(){
  rail.innerHTML = '';
  ACTS.forEach((a, i) => {
    const n = el(`<div class="n" title="${a.role.name} · ${a.line}">${String(a.no).padStart(2, '0')}</div>`);
    n.onclick = () => start(i);
    rail.appendChild(n);
  });
}
function markRail(i){
  [...rail.children].forEach((n, j) => {
    n.className = 'n' + (j < i ? ' done' : j === i ? ' now' : '');
  });
  $('#actLabel').textContent = `第 ${i + 1} / ${ACTS.length} 幕`;
}

function resetAll(){
  feed.innerHTML = '';
  stage.innerHTML = '';
  $('#ws').querySelectorAll('.chip').forEach(c => c.remove());
  const empty = $('#wsEmpty');
  if (empty) empty.style.display = '';
  CUR = { kind:null, html:'' };
  $('#iTag').textContent = '待机';
  $('#iIntent').textContent = '—';
  $('#iView').textContent = '—';
  $('#iData').textContent = '—';
}

async function start(from = 0){
  CTRL.token++;
  const my = CTRL.token;
  CTRL.paused = false;
  syncPlayBtn();
  resetAll();

  // 跳到某一幕时，把之前的固定入口一次性补上
  for (let i = 0; i < from; i++) if (ACTS[i].pin) pinCurrent(ACTS[i].pin);

  for (let i = from; i < ACTS.length; i++){
    if (my !== CTRL.token) return;
    CUR_ACT = i;
    const act = ACTS[i];
    setRole(act.role);
    setTone(act.tone);
    markRail(i);
    await sleepREAL(420);
    if (my !== CTRL.token) return;
    addDivider(act.line);
    await sleepREAL(620);
    if (my !== CTRL.token) return;
    await act.run(mkHelpers(my));
    if (my !== CTRL.token) return;
    await sleepREAL(260);
  }
  if (my === CTRL.token) finish();
}

function finish(){
  markRail(ACTS.length - 1);
  [...rail.children].forEach(n => n.classList.add('done'));
  [...rail.children].forEach(n => n.classList.remove('now'));
  $('#actLabel').textContent = '演示结束';
  const last = el(`<div class="finish" style="margin:10px 0 6px;display:flex;align-items:center;gap:10px;font-size:11.5px;color:#9aa3b0">
    <span style="width:5px;height:5px;border-radius:50%;background:#2f9e6b"></span>演示结束 · 点右下角 ↻ 重播，或点进度条跳到任意一幕
  </div>`);
  feed.appendChild(last);
  scrollFeed();
}

function syncPlayBtn(){
  const icon = CTRL.paused
    ? '<svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M8 5l12 7-12 7z"/></svg>'
    : '<svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><rect x="7" y="5" width="3.4" height="14" rx="1"/><rect x="13.6" y="5" width="3.4" height="14" rx="1"/></svg>';
  $('#pp').innerHTML = icon;
}

/* 控件 */
$('#pp').onclick = () => { CTRL.paused = !CTRL.paused; syncPlayBtn(); };
$('#spd').onclick = () => {
  const seq = [1, 1.5, 2, 0.75];
  const i = seq.indexOf(CTRL.speed);
  CTRL.speed = seq[(i + 1) % seq.length];
  $('#spd').textContent = CTRL.speed.toFixed(2).replace(/0$/, '') + '×';
};
$('#replay').onclick = () => start(0);

function openSpec(){
  const k = CUR.kind;
  if (!k){ toast('还没有生成视图'); return; }
  const json = JSON.stringify(SPECS[k], null, 2);
  $('#specCode').innerHTML = json
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/"([^"]+)":/g, '<span class="k">"$1"</span>:')
    .replace(/: "([^"]*)"/g, ': <span class="s">"$1"</span>')
    .replace(/: (\d+(?:\.\d+)?|true|false)/g, ': <span class="n">$1</span>');
  $('#drawer').classList.add('open');
}
$('#specBtn').onclick = openSpec;
$('#drawerClose').onclick = () => $('#drawer').classList.remove('open');

$('#pinBtn').onclick = () => {
  if (!CUR.kind){ toast('还没有生成视图'); return; }
  pinCurrent(META[CUR.kind].view);
  toast(`已固定「${META[CUR.kind].view}」`);
};

/* ==========================================================
   7. 启动
   ========================================================== */
const _m = location.hash.match(/act=(\d+)/);
const deepAct = _m ? Math.min(ACTS.length - 1, Math.max(0, +_m[1] - 1)) : 0;

buildRail();
setRole(ACTS[deepAct].role);
setTone(ACTS[deepAct].tone);
markRail(deepAct);
syncPlayBtn();
start(deepAct);
</script>
